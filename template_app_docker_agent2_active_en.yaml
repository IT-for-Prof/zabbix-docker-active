  triggers:
  - uuid: 7dbe870525a04920a2bb2373cecd8e44
    expression: max(/Docker by Zabbix agent 2 active Custom/docker.layers_size,10m)=0 and min(/Docker by Zabbix agent 2 active Custom/docker.images.total,10m)>0
    name: 'Docker: Size data is not received'
    priority: WARNING
    dependencies:
    - name: 'Docker: Service is down'
      expression: last(/Docker by Zabbix agent 2 active Custom/docker.ping)=0
    tags:
    - tag: scope
      value: availability
    description: Images exist on the host, but the layer size has been 0 for more than 10 minutes, so the agent gets no size data from Docker. The likely cause is that Docker removed the deprecated /system/df fields, and the fix is an updated Docker plugin of the agent. When the agent is unavailable there is no data, and the trigger does not fire.
