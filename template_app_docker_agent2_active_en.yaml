    - uuid: a62c84d59c0d42f3b8661cea3116fc5e
      name: Images discovery
      type: ZABBIX_ACTIVE
      key: docker.images.discovery
      delay: 15m
      filter:
        evaltype: AND
        conditions:
        - macro: '{#NAME}'
          value: '{$DOCKER.LLD.FILTER.IMAGE.MATCHES}'
        - macro: '{#NAME}'
          value: '{$DOCKER.LLD.FILTER.IMAGE.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
      description: Discovery of images metrics.
      item_prototypes:
      - uuid: 15158c3351924891859d3efaa7c8b8eb
        name: 'Image {#NAME}: Created'
        type: DEPENDENT
        key: docker.image.created["{#ID}"]
        units: unixtime
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.Id == "{#ID}")].Created.first()
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1d
        master_item:
          key: docker.images
        tags:
        - tag: component
          value: system
        - tag: image
          value: '{#NAME}'
      - uuid: 0eaabbedd64b4f61b06ed1deeaaf25cc
        name: 'Image {#NAME}: Size'
        type: DEPENDENT
        key: docker.image.size["{#ID}"]
        units: B
        preprocessing:
        - type: JSONPATH
          parameters:
          - $[?(@.Id == "{#ID}")].Size.first()
        master_item:
          key: docker.images
        tags:
        - tag: component
          value: storage
        - tag: image
          value: '{#NAME}'
